<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040b1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>北京化工大学 · 门票</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="page">
    <div class="stage-wrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="北京化工大学门票动画">
    <defs>
      <radialGradient id="bgG" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(960,496.8) scale(1440,810)">
        <stop offset="0" stop-color="#123463"/><stop offset=".55" stop-color="#0a1f44"/><stop offset="1" stop-color="#040b1d"/>
      </radialGradient>
      <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="150" y1="150" x2="1770" y2="880">
        <stop offset="0" stop-color="#a47b2c"/><stop offset=".12" stop-color="#f9e7a8"/><stop offset=".3" stop-color="#c8983a"/>
        <stop offset=".5" stop-color="#fff3c4"/><stop offset=".68" stop-color="#b98a31"/><stop offset=".86" stop-color="#f6dc92"/><stop offset="1" stop-color="#94701f"/>
      </linearGradient>
      <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff1bd"/><stop offset=".5" stop-color="#e3bb5c"/><stop offset="1" stop-color="#a87c27"/>
      </linearGradient>
      <linearGradient id="goldT" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="490" y2="0">
        <stop offset="0" stop-color="#e6c06a"/><stop offset=".5" stop-color="#fff2c6"/><stop offset="1" stop-color="#dcb256"/>
      </linearGradient>
      <linearGradient id="goldE" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="80" y2="80">
        <stop offset="0" stop-color="#fff4cc"/><stop offset=".45" stop-color="#f3d684"/><stop offset="1" stop-color="#d9ab48"/>
      </linearGradient>
      <linearGradient id="goldW" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="280" y2="60">
        <stop offset="0" stop-color="#f1d281"/><stop offset=".5" stop-color="#fff4cc"/><stop offset="1" stop-color="#e2b95a"/>
      </linearGradient>
      <linearGradient id="stubG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1568cf"/><stop offset=".45" stop-color="#00459b"/><stop offset="1" stop-color="#012b66"/>
      </linearGradient>
      <radialGradient id="stubGlow" cx="50%" cy="42%" r="60%">
        <stop offset="0" stop-color="#4c9bff" stop-opacity=".45"/><stop offset="1" stop-color="#4c9bff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="medG" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#1a6ad2"/><stop offset="1" stop-color="#013276"/>
      </radialGradient>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="SKYTOP"/><stop offset="1" stop-color="SKYBOT"/>
      </linearGradient>
      <linearGradient id="railG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#cfb476"/><stop offset=".08" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f7ecd0"/><stop offset="1" stop-color="#d8c18a"/>
      </linearGradient>
      <linearGradient id="slotG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#050d1d"/><stop offset="1" stop-color="#16284a"/>
      </linearGradient>
      <linearGradient id="progG" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1690" y2="0">
        <stop offset="0" stop-color="#00459b"/><stop offset="1" stop-color="#49b1ff"/>
      </linearGradient>
      <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="pondGrad" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="-60" y2="0">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="pondMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1300" height="700"><rect width="1300" height="700" fill="url(#pondGrad)"/></mask>
      <path id="tshape" d="M179,157 H1741 A22,22 0 0 1 1763,179 V845 A22,22 0 0 1 1741,867 H179 A22,22 0 0 1 157,845 V179 A22,22 0 0 1 179,157 Z"/>
      <mask id="ticketMask" maskUnits="userSpaceOnUse" x="100" y="100" width="1720" height="880">
        <use href="#tshape" fill="#fff"/>
        <g id="maskHoles" fill="#000"></g>
      </mask>
      <clipPath id="mainClip"><rect x="520" y="165" width="1235" height="694" rx="14"/></clipPath>
      <clipPath id="slotClip"><rect x="603" y="783" width="1084" height="38" rx="19"/></clipPath>
      <filter id="tshadow" x="-10%" y="-20%" width="120%" height="150%">
        <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
      </filter>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="sticker" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="4.2" result="d2"/>
        <feFlood flood-color="#b48a34"/><feComposite in2="d2" operator="in" result="o2"/>
        <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d1"/>
        <feFlood flood-color="#fff8e2"/><feComposite in2="d1" operator="in" result="o1"/>
        <feGaussianBlur in="d2" stdDeviation="3" result="sh"/><feOffset in="sh" dx="2" dy="5" result="sh2"/>
        <feComponentTransfer in="sh2" result="sh3"><feFuncA type="linear" slope=".35"/></feComponentTransfer>
        <feMerge><feMergeNode in="sh3"/><feMergeNode in="o2"/><feMergeNode in="o1"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <g id="emblemSrc"></g>
      <g id="wordSrc"></g>
      <path id="star4" d="M0,-1 C.08,-.3 .3,-.08 1,0 C.3,.08 .08,.3 0,1 C-.08,.3 -.3,.08 -1,0 C-.3,-.08 -.08,-.3 0,-1Z"/>
    </defs>

    <!-- 背景比画面大一圈，配合 #stage{overflow:visible} 让画面边缘和页面底色无缝衔接 -->
      <rect x="-4000" y="-4000" width="9920" height="9080" fill="url(#bgG)"/>
    <g id="bgdeco" fill="none" stroke="#6f8fc4" stroke-opacity=".28" stroke-width="1.5"></g>

    <g id="ticketWrap">
      <!-- 阴影只作用在静态票形上，避免滤镜随动画逐帧重算（移动端 Safari 性能） -->
      <g filter="url(#tshadow)"><g mask="url(#ticketMask)"><use href="#tshape" fill="url(#gold)"/></g></g>
      <g>
        <g mask="url(#ticketMask)">
          <use href="#tshape" fill="url(#gold)"/>
          <g id="stub"></g>
          <g id="main" clip-path="url(#mainClip)">
            <rect x="520" y="165" width="1235" height="580" fill="url(#skyG)"/>
            <g id="deco"></g>
            <g id="scene"></g>
            <g id="sparkles"></g>
            <g id="rail"></g>
          </g>
          <rect x="520.75" y="165.75" width="1233.5" height="692.5" rx="13.5" fill="none" stroke="#7b5c1c" stroke-opacity=".7" stroke-width="1.5"/>
          <g id="rims"></g>
          <rect id="shine" x="0" y="100" width="260" height="900" fill="url(#shineG)" transform="translate(-400,0) skewX(-20)"/>
        </g>
      </g>
      <g id="trail"></g>
      <g id="riderShadow"></g>
      <g id="rider" filter="url(#sticker)"></g>
      <!-- 滑轨触控热区：只有这里拦截页面滚动 -->
      <rect id="railHit" x="520" y="690" width="1235" height="177" fill="#000" fill-opacity="0" pointer-events="all"/>
    </g>
    <g id="caption" opacity="0">
      <text x="960" y="972" text-anchor="middle" font-size="32" font-weight="600" letter-spacing="5" fill="#cdb67c">始发站 · 北京化工大学 (1958)</text>
      <path d="M640,962 H560 M1280,962 H1360" stroke="#cdb67c" stroke-opacity=".5" stroke-width="1.5"/>
      <use href="#star4" transform="translate(548,962) scale(5)" fill="#cdb67c" fill-opacity=".7"/>
      <use href="#star4" transform="translate(1372,962) scale(5)" fill="#cdb67c" fill-opacity=".7"/>
    </g>
    </svg>
    </div>
    <div class="controls">
      <p class="hint" id="hint">按住骑车小人或滑轨左右拖动</p>
      <button class="replay" id="replay" type="button">重播 ↻</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
